name: st_flutter_shell
description: Flutter WebView shell for self-hosted SillyTavern.
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
